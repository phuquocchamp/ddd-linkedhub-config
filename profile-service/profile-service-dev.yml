server:
  port: ${SERVER_PORT:8092}

spring:
  cloud:
    config:
      name: profile-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/profile
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc: time_zone=UTC
  jackson:
    time-zone: UTC

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

info:
  application:
    name: auth-service
    description: Profile Service for Domain Driven Deign LinkedHub
    version: ${APP_VERSION:1.0.0}
  env:
    enabled: ${ENV_ENABLED:true}
