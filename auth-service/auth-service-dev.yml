server:
  port: ${SERVER_PORT:8091}

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secret}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false

info:
  application:
    name: auth-service
    branch: dev
    description: Auth Service for Domain Driven Deign LinkedHub
    version: ${APP_VERSION:1.0.0}
  env:
    enabled: ${ENV_ENABLED:true}
