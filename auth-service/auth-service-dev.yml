server:
  port: 8091

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: postgres
    password: secret

  data:
    redis:
      host: "localhost"
      port: 6379

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false

info:
  application:
    name: auth-service
    branch: dev
    description: Auth Service for Domain Driven Deign LinkedHub
    version: 1.0.0
  env:
    enabled: true
